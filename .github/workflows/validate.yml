name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Parse Turtle files
        run: |
          python - <<'PY'
          from pathlib import Path
          from rdflib import Graph
          files = sorted(Path(".").rglob("*.ttl"))
          if not files:
              raise SystemExit("No Turtle files found.")
          for path in files:
              Graph().parse(path, format="turtle")
              print(f"OK  {path}")
          PY
      - name: Smoke-test visualizer
        run: python scripts/visualize_example.py --output /tmp/rcont-example.html
